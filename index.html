<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greeting Card Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Cairo", Tahoma, Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel,
    .preview-box {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 24px;
    }

    .panel {
      margin-top: 100%;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      color: #111827;
    }

    .hint {
      margin: 0 0 22px;
      color: #6b7280;
      line-height: 1.7;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 14px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .primary {
      background: #2563eb;
      color: #fff;
    }

    .secondary {
      background: #111827;
      color: #fff;
    }

    .note {
      font-size: 13px;
      color: #6b7280;
      margin-top: 16px;
      line-height: 1.7;
    }

    canvas {
      width: 100%;
      height: auto;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      display: block;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }

      .panel {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="panel">
      <h1>للمعايدة</h1>
      <!--<p class="hint">اكتب الاسم، وبعدها نزّل الكارت مباشرة كصورة PNG.</p>-->

      <label for="employeeName">اسم الموظف</label>
      <input id="employeeName" maxlength="30" type="text" placeholder="مثال: احمد محمد" autocomplete="name" />

      <label for="employeeNameEn">اسم الموظف بالإنجليزية</label>
      <input id="employeeNameEn" maxlength="30" type="text" placeholder="مثال: Ahmed Mohamed" autocomplete="name" />

      <!--<button class="primary" onclick="generateCard()">إنشاء الكارت</button>-->
      <button class="secondary" onclick="downloadCard()">التحميل</button>

    </section>

    <section class="preview-box">
      <canvas id="cardCanvas" width="722" height="1280"></canvas>
    </section>
  </main>

    const canvas = document.getElementById("cardCanvas");
    const ctx = canvas.getContext("2d");

    const bg = new Image();

    bg.src = BACKGROUND_IMAGE;

    bg.onload = generateCard;

    bg.onerror = function () {
      drawFallbackCard();
    };

    function drawFallbackCard() {
      const name = document.getElementById("employeeName").value.trim() || "اسم الموظف";
      const englishName = document.getElementById("employeeNameEn").value.trim() || "Employee Name";

      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, "#0f172a");
      gradient.addColorStop(0.55, "#1d4ed8");
      gradient.addColorStop(1, "#d4af37");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255,255,255,0.10)";
      ctx.beginPath();
      ctx.arc(610, 180, 150, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(90, 1100, 180, 0, Math.PI * 2);
      ctx.fill();

      drawTextContent(name, englishName);
    }

    function generateCard() {
      const name = document.getElementById("employeeName").value.trim() || "اسم الموظف";
      const englishName = document.getElementById("employeeNameEn").value.trim() || "Employee Name";

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (bg.complete && bg.naturalWidth > 0) {
        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
      } else {
        drawFallbackCard();
        return;
      }

      drawTextContent(name, englishName);
    }

    function drawTextContent(name, englishName) {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.direction = "rtl";

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 36px Cairo, Tahoma, Arial";
      ctx.fillText(name, 460, 1163);

      ctx.direction = "ltr";
      ctx.font = "bold 36px Cairo, Arial";
      ctx.fillText(englishName, 450, 1208);
    }

    function downloadCard() {
      generateCard();

      const name = document.getElementById("employeeName").value.trim() || "employee";
      const safeName = name.replace(/[\\/:*?"<>|]/g, "-").replace(/\s+/g, "_");

      canvas.toBlob(function (blob) {
        if (!blob) {
          alert("تعذر تحميل الكارت. جرّب تحديث الصفحة ثم اضغط تحميل مرة أخرى.");
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.download = `greeting-card-${safeName}.png`;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, "image/png");
    }

    document.getElementById("employeeName").addEventListener("input", generateCard);
    document.getElementById("employeeNameEn").addEventListener("input", generateCard);

    drawFallbackCard();

    if (document.fonts) {
      document.fonts.ready.then(generateCard);
    }
  </script>
